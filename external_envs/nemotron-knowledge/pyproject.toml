[project]
name = "nemotron-knowledge"
description = "Knowledge env combining Nemotron MCQA and QA abstention data"
tags = ["single-turn", "knowledge", "mcqa", "abstention", "train", "eval", "nemotron"]
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.12",
    "datasets",
    "huggingface-hub",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["nemotron_knowledge.py", "nemotron_knowledge_guardrails.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 2
