[project]
name = "nemotron-tool-calling"
description = "Tool-calling env for Nemotron pivot action datasets with explicit proxy selectors for full tool-session data"
tags = ["single-turn", "tool-use", "agentic", "function-calling", "prompt-injection", "swe", "train", "eval", "nemotron"]
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.12",
    "datasets",
    "huggingface-hub",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["nemotron_tool_calling.py", "nemotron_tool_calling_guardrails.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 1
