[project]
name = "decensor-env"
version = "0.7.1"
description = "Decensor env with user-simulated multi-turn rollouts, prompt-style buckets, geometric turn-count decay, harm-stratified sampling, a generalist keep-alive mix, and per-turn reasoning guardrails"
tags = ["multi-turn", "refusals", "train", "eval"]
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.9",
    "datasets",
    "httpx",
    "huggingface_hub",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["decensor_env.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 50
rollouts_per_example = 8
