[project]
name = "nemotron-reasoning"
description = "Reasoning env combining Nemotron ReasoningGym, Math-v2, Science-v1, and ARC-AGI sources"
tags = ["reasoning", "math", "science", "arc-agi", "tool-use", "multi-turn", "train", "eval", "nemotron"]
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
    "datasets",
    "huggingface-hub",
    "openai",
    "reasoning-gym",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["nemotron_reasoning.py", "nemotron_reasoning_guardrails.py", "pyproject.toml", "README.md"] 

[tool.verifiers.eval]
num_examples = 8
rollouts_per_example = 1
