[project]
name = "nemotron-instruction-following"
description = "Instruction-following env combining latest individual NVIDIA Nemotron-RL instruction datasets"
tags = ["single-turn", "instruction-following", "tool-use", "judge", "train", "eval", "nemotron"]
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.12",
    "datasets",
    "huggingface-hub",
    "langdetect",
    "jsonschema",
    "openai",
    "pyyaml",
    "tomli; python_version < '3.11'",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["nemotron_instruction_following.py", "nemotron_instruction_following_guardrails.py", "pyproject.toml", "README.md"]

[tool.verifiers.eval]
num_examples = 12
rollouts_per_example = 1
