alpha = 64
dropout = 0.0

[trainer.optim]
type = "adamw"
lr = 0.000008
weight_decay = 0.0
max_norm = 1.0

[trainer.ckpt.weights]
save_adapter_separately = true
save_sharded = true

[orchestrator]
batch_size = 2048
group_size = 8
oversampling_factor = 0.0625
max_off_policy_steps = 8
tasks_per_minute = 240
renderer = "None"

[orchestrator.wandb.log_extras]
interval = 25
sample_ratio = 0.02

[orchestrator.train]
num_workers = 4
max_retries = 3

[orchestrator.train.sampling]
max_completion_tokens = 16384
temperature = 1.0

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
return_token_ids = true
max_prompt_len = 16384

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = true

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = true

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
