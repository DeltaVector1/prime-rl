output_dir = "outputs/trinity-mini-step75-decensor-logic-math-science-toolcalling-32k-bsz2048"
clean_output_dir = true
max_steps = 200
seq_len = 32768

[log]
level = "info"

[model]
name = "NewEden/trinity-mini-step100-hardmix-local-sandbox-step75"

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[wandb]
project = "trinity-mini-prime-rl"
name = "trinity-mini-step75-decensor-logic-math-science-toolcalling-bsz2048"

[ckpt]
interval = 25
keep_last = 2
keep_interval = 100

[trainer]
dist_timeout_seconds = 1800

[trainer.model]
impl = "custom"
attn = "flash_attention_2"
ep = 4
fsdp_cpu_offload = false
optim_cpu_offload = true
cp = 2
cp_style = "ulysses"
