[orchestrator.teacher.client]
base_url = ["http://127.0.0.1:8001/v1"]
timeout = 1200
wait_for_ready_timeout = 1800
dp_rank_count = 1

[orchestrator.eval]
interval = 25
num_examples = 16
group_size = 1
max_retries = 0
skip_first_step = false

[orchestrator.eval.sampling]
temperature = 0.0
top_p = 1.0
max_completion_tokens = 16384

[orchestrator.eval.sampling.extra_body]
truncate_prompt_tokens = 16384

